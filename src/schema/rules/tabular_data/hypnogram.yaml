---
hypnogram:
  selectors:
    - suffix == "hypnogram"
    - extension == ".tsv"
  initial_columns:
    - onset
    - duration
    - stage
  columns:
    onset: required
    duration: required
    stage: required
    scorer: optional
    confidence: optional
  additional_columns: allowed_if_defined

hypnogramSidecar:
  selectors:
    - suffix == "hypnogram"
    - extension == ".json"
  properties:
    stage:
      display_name: Sleep Stage
      description: |
        Categorical labels for sleep stages.
      type: object
      properties:
        Levels:
          type: object
          additionalProperties:
            type: string
            description: |
              Human-readable description of the stage label.
              For handling noisy or missing data, labels such as 'Artefact' or 'Unscored' MUST be defined here.
    scorer:
      display_name: Scorer
      description: |
        Categorical labels for the annotation source.
      type: object
      properties:
        Levels:
          type: object
          additionalProperties:
            type: string
            description: |
              Human-readable description of the scorer.
              For multiple scorers, all possible scorer values MUST be defined here.
confidence:
  name: confidence
  display_name: Confidence Score
  description: |
    Overall confidence score for the sleep stage annotation.
  type: number
  metadata:
    - StagesDefinition:
        required: false
